[package]
name = "base32"
version = "1.0.0-rc.1"
authors = [
    "Andreas Ots <qrpth@qrpth.eu>",
    "Tim Dumol <tim@timdumol.com>",
    "Dave Grantham <dwg@linuxprogrammer.org>",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/andreasots/base32"
description = "Base32 encoder/decoder for Rust"
keywords = ["base32", "encode", "decode", "no_std"]
categories = ["encoding", "parser-implementations", "no-std"]
edition = "2024"

[features]
default = ["std"]
std = ["alloc"]
alloc = []

[dev-dependencies]
quickcheck = "1.0.3"
